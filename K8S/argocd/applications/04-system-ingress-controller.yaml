apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-ingress-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: system-utils
  source:
    repoURL: 'https://github.com/j1nn33/study.git'
    path: K8S/argocd/01-clusterapp/03-ingress-nginx
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    syncOptions:
      - CreateNamespace=true